services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: coord
      POSTGRES_USER: coord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - coord-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coord -d coord']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  coord-postgres:
